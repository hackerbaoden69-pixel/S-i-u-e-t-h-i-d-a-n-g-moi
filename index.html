@keyframes kb{to{transform:scale(1.75) translate(-3%,2%)}}

.bg{z-index:-2;overflow:hidden;mix-blend-mode:screen;opacity:.5}

.bg i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);animation:fl 16s ease-in-out infinite alternate}

.bg i:nth-child(1){background:#ff2d87;left:-20vmax;top:-15vmax}.bg i:nth-child(2){background:#6a3dff;right:-25vmax;top:15vmax;animation-delay:-6s}.bg i:nth-child(3){background:#ffb400;left:-5vmax;bottom:-30vmax;animation-delay:-10s}

@keyframes fl{to{transform:translate(9vmax,6vmax) scale(1.25)}}

.vg{z-index:-1;background:radial-gradient(ellipse at 50% 20%,transparent,rgba(10,4,30,.65))}

main{max-width:560px;margin:0 auto;padding:14px 14px 50px}

.glass{background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.05));backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%);border:1px solid rgba(255,255,255,.3);border-radius:30px;box-shadow:0 14px 44px rgba(0,0,0,.4),inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.1)}

.hd{display:flex;align-items:center;gap:12px;padding:10px 12px;animation:in .8s cubic-bezier(.2,.8,.2,1) both}

@keyframes in{from{opacity:0;transform:translateY(22px) scale(.97)}}

.hd img{width:62px;height:62px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px rgba(255,255,255,.5),0 0 28px rgba(255,200,0,.6)}

.hd h1{flex:1;font-size:1.3rem;line-height:1.1;background:linear-gradient(90deg,#fff3a0,#ff8fd0);-webkit-background-clip:text;background-clip:text;color:transparent}.hd h1 small{display:block;font-size:.75rem;-webkit-text-fill-color:rgba(255,255,255,.75);font-weight:500;margin-top:3px}

.ib{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:1.1rem;cursor:pointer;transition:.25s}.ib:active{transform:scale(.88)}

.lgc{margin:12px 0;padding:14px;animation:in .8s .1s cubic-bezier(.2,.8,.2,1) both;transition:transform .3s}

.lgc.sh{animation:sh .5s}@keyframes sh{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

.in{display:flex;gap:8px;flex-wrap:wrap}.in input{flex:1 1 140px;min-width:0}.in input.c{flex:0 1 110px}

input{padding:14px 15px;border-radius:18px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font-size:1rem;outline:none;width:100%;transition:.25s}

input::placeholder{color:rgba(255,255,255,.55)}input:focus{border-color:#ffe36b;box-shadow:0 0 0 4px rgba(255,227,107,.22);background:rgba(255,255,255,.18)}

button{font:inherit;color:#fff;cursor:pointer;border:0}

.btn{padding:14px 20px;border-radius:20px;font-weight:800;font-size:1rem;background:linear-gradient(135deg,#ff2d87,#ff9a3c);box-shadow:0 8px 26px rgba(255,45,135,.55),inset 0 1.5px 0 rgba(255,255,255,.55);transition:.25s;white-space:nowrap}

.btn:active{transform:scale(.94)}.btn.w{width:100%;margin-top:10px}.btn.s{padding:9px 16px;font-size:.85rem}

.err{color:#ffc2d4;min-height:1.2em;margin-top:6px;font-size:.9rem;font-weight:600;width:100%}

.hi{display:flex;align-items:center;gap:12px;font-size:1.05rem;animation:in .6s both}.hi span{font-size:2rem}.hi div{flex:1;line-height:1.2}.hi small{opacity:.7}.hi i{font-style:normal;background:rgba(60,230,150,.28);border:1px solid rgba(60,230,150,.6);padding:6px 12px;border-radius:99px;font-size:.8rem;font-weight:700}

.seg{position:relative;display:flex;padding:5px;border-radius:24px;margin-bottom:12px}

.th{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/3);border-radius:19px;background:linear-gradient(135deg,rgba(255,255,255,.38),rgba(255,255,255,.14));box-shadow:0 4px 16px rgba(0,0,0,.3),inset 0 1.5px 0 rgba(255,255,255,.6);transform:translateX(calc(var(--i)*100%));transition:transform .55s cubic-bezier(.3,1.3,.4,1)}

.seg button{position:relative;flex:1;padding:12px 4px;background:none;font-weight:700;font-size:.9rem;opacity:.65;transition:opacity .3s}.seg button.on{opacity:1}.seg button:disabled{opacity:.3}

.pw{position:relative;padding:14px 8px 18px;overflow:hidden}

.panels{display:grid}.pn{grid-area:1/1;opacity:0;transform:scale(.94) translateY(10px);pointer-events:none;transition:opacity .5s,transform .6s cubic-bezier(.2,.9,.3,1);text-align:center}.pn.on{opacity:1;transform:none;pointer-events:auto}

.lk{position:absolute;left:50%;top:10px;z-index:5;transform:translate(-50%,0);background:rgba(20,8,50,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);padding:8px 16px;border-radius:99px;font-size:.85rem;font-weight:700;white-space:nowrap;transition:.5s;pointer-events:none}

.pw.open .lk{opacity:0;transform:translate(-50%,-20px)}.pw:not(.open) .panels{filter:saturate(.7) brightness(.85)}.panels{transition:filter .6s}

.hint{opacity:.85;font-size:.9rem;margin:8px 0 2px;padding-top:34px}

.ww{position:relative;width:var(--R);height:var(--R);margin:22px auto 8px;--R:min(80vw,340px)}

.ring{position:absolute;inset:-18px;border-radius:50%;background:repeating-conic-gradient(#fff3a0 0 4deg,transparent 4deg 15deg),linear-gradient(135deg,#ffd700,#ff7a00);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 15px),#000 calc(100% - 14px));mask:radial-gradient(farthest-side,transparent calc(100% - 15px),#000 calc(100% - 14px));animation:bl 1s steps(2) infinite;filter:drop-shadow(0 0 12px #ffb400)}

.ring2{position:absolute;inset:-18px;border-radius:50%;border:5px solid #ffcf33;box-shadow:0 0 36px rgba(255,190,0,.7),inset 0 0 20px rgba(255,190,0,.5)}

@keyframes bl{50%{opacity:.55}}

.wheel{width:100%;height:100%;border-radius:50%;position:relative;transition:transform 5.2s cubic-bezier(.12,.7,.1,1);box-shadow:inset 0 0 40px rgba(0,0,0,.35)}

.wheel::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.7) 0 1deg,transparent 1deg 51.4286deg)}

.wheel::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.4),transparent 55%)}

.wheel b{position:absolute;left:50%;top:50%;width:4.6rem;height:3.6rem;margin:-1.8rem -2.3rem;text-align:center;font-size:1.9rem;line-height:1.9rem;z-index:1}

.wheel b small{display:block;font-size:.62rem;line-height:.9rem;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.6)}

.ptr{position:absolute;left:50%;top:-30px;margin-left:-18px;border:18px solid transparent;border-top:36px solid #fff;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6));z-index:4;transform-origin:50% 0}

.ptr.tk{animation:tkp .12s}@keyframes tkp{50%{transform:rotate(-14deg)}}

.hub{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px;border-radius:50%;z-index:3;font-weight:900;font-size:1rem;background:radial-gradient(circle at 30% 25%,#fff7b0,#ff9a3c 55%,#ff2d87);box-shadow:0 0 0 5px rgba(255,255,255,.85),0 8px 24px rgba(0,0,0,.55);animation:pu 1.6s ease-in-out infinite}

@keyframes pu{50%{transform:scale(1.07)}}.hub:disabled{animation:none}

.cup{position:relative;height:280px;display:flex;justify-content:center;align-items:flex-end;gap:7px;padding:0 22px}

.stick{position:relative;width:30px;height:215px;border-radius:15px;background:linear-gradient(90deg,#d99a52,#fff0c4 45%,#c98a44);box-shadow:0 4px 12px rgba(0,0,0,.45);cursor:pointer;transition:transform .9s cubic-bezier(.2,.9,.3,1);transform-origin:bottom;font-weight:900;color:#7a4a12;padding-top:8px}

.stick:nth-child(odd){transform:rotate(-3deg)}.stick:nth-child(even){transform:rotate(3deg)}.stick:hover{transform:translateY(-16px)}.stick.up{transform:translateY(-84px) rotate(0)!important}

.stick em{position:absolute;left:50%;top:-48px;transform:translateX(-50%) scale(0);font-style:normal;font-size:2.2rem;transition:.5s .6s cubic-bezier(.2,1.6,.3,1)}.stick.up em{transform:translateX(-50%) scale(1)}

.cupf{position:absolute;left:6px;right:6px;bottom:0;height:115px;border-radius:14px 14px 44px 44px;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.1));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 2px 0 rgba(255,255,255,.6)}

.tks{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:8px 10px;perspective:900px}

.tc{aspect-ratio:3/4;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.9,.3,1)}

.tc:hover{transform:translateY(-8px) rotate(-3deg)}.tc.flip{transform:rotateY(180deg)}

.tc>div{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:1.9rem;font-weight:900;border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6)}

.tc .f{background:linear-gradient(145deg,#ff2d87,#7a3cff);box-shadow:0 8px 22px rgba(122,60,255,.55)}.tc .k{background:linear-gradient(145deg,#ffe36b,#ff9a3c);transform:rotateY(180deg);font-size:2.5rem}

.lst{padding:16px;margin-top:12px;font-size:.88rem}.lst p{font-weight:800;margin-bottom:4px}.lst div{display:flex;gap:12px;align-items:center;padding:7px 2px;border-bottom:1px solid rgba(255,255,255,.12)}.lst div:last-child{border:0}.lst span{font-size:1.4rem}

.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(8,2,26,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fi .4s}@keyframes fi{from{opacity:0}}

.md{width:100%;max-width:380px;padding:32px 22px;text-align:center;animation:pop .7s cubic-bezier(.2,1.4,.3,1)}@keyframes pop{from{transform:scale(.4);opacity:0}}

.md .big{font-size:5.5rem;animation:pu 1.2s infinite}.md h2{margin:8px 0}

.cf{position:fixed;top:-40px;z-index:30;font-size:1.6rem;pointer-events:none;animation:cf 3s linear forwards}@keyframes cf{to{transform:translateY(110vh) rotate(540deg)}}

#adm{opacity:0;pointer-events:none;transition:opacity .45s;animation:none;align-items:flex-start;overflow:auto}#adm.show{opacity:1;pointer-events:auto}

.sheet{width:100%;max-width:520px;margin:auto;padding:22px 16px;text-align:center;transform:translateY(30px) scale(.96);transition:transform .6s cubic-bezier(.2,.9,.3,1)}#adm.show .sheet{transform:none}

.sheet .av{width:100px;height:100px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px rgba(255,255,255,.5),0 0 30px rgba(120,80,255,.7)}.sheet h2{margin:8px 0 4px;font-size:1.25rem}

.row{display:flex;gap:8px;align-items:center;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left;font-size:.9rem}.row span{flex:1}.row small{opacity:.65;display:block}

.x{background:rgba(255,60,90,.4);border-radius:50%;width:32px;height:32px}

.sl{text-align:left;padding:8px 0}.sl input{padding:0;height:28px;accent-color:#ff6ec7;background:none;border:0;box-shadow:none}.sl p{display:flex;justify-content:space-between;font-size:.9rem}

.adt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.adt button{padding:10px 4px;border-radius:16px;background:rgba(255,255,255,.1);font-weight:700;font-size:.85rem;transition:.3s}.adt button.on{background:rgba(255,255,255,.3)}

.fd{animation:fi .4s}

const COL=["#ff2d87","#7a3cff","#00a8ff","#f5a700","#13b574","#ff6a3d","#b02cff"],GN=["Vòng quay","Rút đũa","Bốc thăm"],PW="dang14",KEY="sd_minigame_v1";

let S={};try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}

S.c=S.c||[];S.h=S.h||[];S.w=S.w||[20,20,20,12,12,10,6];

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const norm=s=>s.trim().replace(/\s+/g," ").toLowerCase();

let ses=null,game=0,busy=false,atab=0,aon=false,clr=false,mute=false;

/* ---- âm thanh ---- */

let AC;const ac=()=>{try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume()}catch(e){}return AC};

function tone(f,t,d,ty,v,f2){const a=ac();if(!a||mute)return;const o=a.createOscillator(),g=a.createGain(),T=a.currentTime+t;o.type=ty||"sine";o.frequency.setValueAtTime(f,T);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+d);g.gain.setValueAtTime(v||.2,T);g.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(g);g.connect(a.destination);o.start(T);o.stop(T+d+.05)}

function ratchet(){const a=ac();if(!a||mute)return;const n=900,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type="bandpass";f.frequency.value=2400+Math.random()*900;f.Q.value=2.5;g.gain.value=1.1;s.connect(f);f.connect(g);g.connect(a.destination);s.start();tone(900,0,.04,"square",.06,400);const p=$("#ptr");p.classList.remove("tk");p.offsetWidth;p.classList.add("tk")}

function say(t,p,r){try{if(mute)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="vi-VN";u.pitch=p;u.rate=r;speechSynthesis.speak(u)}catch(e){}}

function win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.11,.3,"triangle",.25));tone(500,.8,.5,"sawtooth",.12,1000);tone(1200,.8,.5,"square",.06,2400);[1568,2093,2637].forEach((f,i)=>tone(f,1.3+i*.08,.3,"sine",.12));setTimeout(()=>say("Chúc mừng bạn! Trúng thưởng rồi!",1.6,1.05),900)}

function lose(){[[392,0],[370,.4],[349,.8]].forEach(x=>tone(x[0],x[1],.38,"sawtooth",.18,x[0]*.97));tone(311,1.2,1.1,"sawtooth",.2,196);tone(330,1.2,1.1,"sine",.1,170);tone(300,2.4,.35,"sine",.25,70);setTimeout(()=>say("Ôi không! Chúc bạn may mắn lần sau nha!",.55,.85),1500)}

function togSnd(){mute=!mute;$("#snd").textContent=mute?"🔇":"🔊";try{speechSynthesis.cancel()}catch(e){}}

/* ---- giao diện ---- */

function build(){const s=360/7;

 $("#wh").style.background=`conic-gradient(${COL.map((c,i)=>`${c} ${i*s}deg ${(i+1)*s}deg`).join(",")})`;

 $("#wh").innerHTML=P.map((p,i)=>`<b style="transform:rotate(${(i+.5)*s}deg) translateY(calc(var(--R)*-.36))">${p[0]}<small>${p[2]}</small></b>`).join("");

 $("#cup").insertAdjacentHTML("afterbegin",P.map((p,i)=>`<div class="stick" onclick="pick(${i},this)">${i+1}<em></em></div>`).join(""));

 $("#tks").innerHTML=P.map((p,i)=>`<div class="tc" onclick="pick(${i},this)"><div class="f">?<small style="font-size:.8rem">${i+1}</small></div><div class="k"></div></div>`).join("");

 $("#lst").innerHTML="<p>🎁 Các phần thưởng</p>"+P.map(p=>`<div><span>${p[0]}</span>${p[1]}</div>`).join("");renderLg()}

function renderLg(){const l=$("#lg");$("#pw").classList.toggle("open",!!ses);

 l.innerHTML=ses?`<div class="hi"><span>👋</span><div><small>Người chơi</small><br><b>${esc(ses.n)}</b></div><i>✓ Sẵn sàng</i></div>`:`<div class="in fd"><input id="n" placeholder="Họ và tên" autocomplete="off"><input class="c" id="k" placeholder="Mã 4 số" inputmode="numeric" maxlength="4" autocomplete="off"><button class="btn" id="go" onclick="login()">Vào chơi</button><p class="err" id="err"></p></div>`}

function bad(t){const l=$("#lg");l.classList.remove("sh");l.offsetWidth;l.classList.add("sh");const e=$("#err");if(e)e.textContent=t;tone(180,0,.25,"sawtooth",.15,90)}

function login(){ac();const n=$("#n").value,k=$("#k").value.trim();

 if(!n.trim()||!k)return bad("Vui lòng nhập họ tên và mã khách hàng.");

 const c=S.c.find(x=>norm(x.n)==norm(n)&&x.k==k);

 if(!c){const u=S.h.some(x=>norm(x.n)==norm(n)||x.k==k);return bad(u?"Tên hoặc mã này đã được sử dụng!":"Sai mật khẩu hoặc bạn gian lận!")}

 ses={n:c.n,k:c.k,used:0};renderLg();[659,784,1047].forEach((f,i)=>tone(f,i*.09,.2,"triangle",.2))}

function setG(i){if(busy)return;ac();game=i;$("#tabs").style.setProperty("--i",i);document.querySelectorAll("#tabs button").forEach((b,j)=>b.classList.toggle("on",j==i));for(let j=0;j<3;j++)$("#p"+j).classList.toggle("on",j==i);tone(700+i*150,0,.12,"sine",.12)}

function roll(){const t=S.w.reduce((a,b)=>a+b,0);let r=Math.random()*t;for(let i=0;i<7;i++){if((r-=S.w[i])<0)return i}return 0}

function pick(i,el){ac();if(busy)return;if(!ses){bad("Hãy nhập họ tên và mã khách hàng trước khi chơi!");return}

 busy=true;document.querySelectorAll("#tabs button").forEach(b=>b.disabled=true);$("#hub").disabled=true;

 if(!ses.used){S.c=S.c.filter(x=>!(x.k==ses.k&&norm(x.n)==norm(ses.n)));ses.used=1}

 const r=roll();S.h.unshift({n:ses.n,k:ses.k,p:r,g:game,t:Date.now()});save();let d=1700;

 if(game==0){const w=$("#wh"),s=360/7,cur=+(w.dataset.r||0),tg=360-(r+.5)*s+(Math.random()-.5)*s*.6,nx=Math.ceil(cur/360)*360+2160+tg;w.dataset.r=nx;w.style.transform=`rotate(${nx}deg)`;d=5600;

  let t=0,g=35;while(t<5000){setTimeout(ratchet,t);t+=g;g*=1.07}}

 else{tone(300,0,.25,"sine",.2,900);el.classList.add(game==1?"up":"flip");(game==1?el.querySelector("em"):el.querySelector(".k")).textContent=P[r][0];setTimeout(()=>tone(1000,.1,.15,"triangle",.15),700)}

 setTimeout(()=>modal(r),d)}

function modal(r){const o=document.createElement("div");o.className="ov";

 o.innerHTML=`<div class="glass md"><div class="big">${P[r][0]}</div><h2>${r<3?"Rất tiếc!":"Chúc mừng "+esc(ses.n)+"!"}</h2><p style="font-size:1.15rem;font-weight:700">${P[r][1]}</p><button class="btn w" id="ok">${r==6?"Chơi thêm lượt nữa":"Hoàn tất"}</button></div>`;

 document.body.appendChild(o);if(r>=3){conf();win()}else lose();

 $("#ok").onclick=()=>{o.remove();try{speechSynthesis.cancel()}catch(e){}busy=false;if(r!=6)ses=null;

  document.querySelectorAll("#tabs button").forEach(b=>b.disabled=false);$("#hub").disabled=false;

  document.querySelectorAll(".stick.up").forEach(e=>e.classList.remove("up"));document.querySelectorAll(".tc.flip").forEach(e=>e.classList.remove("flip"));renderLg()}}

function conf(){for(let i=0;i<36;i++){const s=document.createElement("span");s.className="cf";s.textContent=["🎉","✨","🎊","⭐"][i%4];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*1.2+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),4600)}}

/* ---- quản trị ---- */

function openAdm(){ac();$("#adm").classList.add("show");ra()}

function closeAdm(){$("#adm").classList.remove("show");aon=false}

function ra(){const e=$("#sh");

 if(!aon){e.innerHTML=`<img class="av" src="${ADM}" alt=""><h2>Người điều hành website</h2><p style="opacity:.7;font-size:.9rem;margin-bottom:12px">Đăng nhập quản trị viên</p><input id="ap" type="password" placeholder="Mật khẩu"><p class="err" id="ae"></p><button class="btn w" onclick="if($('#ap').value==PW){aon=true;atab=0;ra()}else $('#ae').textContent='Sai mật khẩu quản trị viên.'">Đăng nhập</button><button class="btn s" style="margin-top:12px;background:rgba(255,255,255,.18)" onclick="closeAdm()">Đóng</button>`;return}

 const T=["Cấp lượt chơi","Lịch sử","Random"];let b="";

 if(atab==0)b=`<input id="an" placeholder="Tên khách hàng" style="margin-bottom:8px"><input id="ak" placeholder="Mã 4 số" inputmode="numeric" maxlength="4"><p class="err" id="ae"></p><button class="btn w" style="margin-top:0" onclick="addC()">Thêm khách hàng</button><p style="text-align:left;margin:14px 0 2px;font-weight:700">Đang được phép chơi (${S.c.length})</p>${S.c.map((c,i)=>`<div class="row"><span>${esc(c.n)}<small>Mã: ${esc(c.k)}</small></span><button class="x" onclick="S.c.splice(${i},1);save();ra()">✕</button></div>`).join("")||'<p style="opacity:.7;font-size:.9rem">Chưa có khách hàng nào.</p>'}`;

 if(atab==1)b=(S.h.map(h=>`<div class="row"><span style="font-size:1.7rem;flex:0">${P[h.p][0]}</span><span><b>${esc(h.n)}</b> · ${esc(h.k)}<small>${P[h.p][1]} · ${GN[h.g]} · ${new Date(h.t).toLocaleString("vi-VN")}</small></span></div>`).join("")||'<p style="opacity:.7">Chưa có lịch sử.</p>')+(S.h.length?`<button class="btn s" style="margin-top:12px;background:rgba(255,60,90,.5)" onclick="if(clr){S.h=[];save();clr=false;ra()}else{clr=true;this.textContent='Bấm lần nữa để xóa hết'}">Xóa lịch sử</button>`:"");

 if(atab==2)b=`<p style="text-align:left;opacity:.8;font-size:.9rem">Kéo từ 1 đến 100: số càng cao càng dễ trúng.</p>`+P.map((p,i)=>`<div class="sl"><p><span>${p[0]} ${p[1]}</span><b id="pc${i}"></b></p><input type="range" min="1" max="100" value="${S.w[i]}" oninput="S.w[${i}]=+this.value;save();pcs()"></div>`).join("");

 e.innerHTML=`<img class="av" src="${ADM}" alt=""><h2>Người điều hành website</h2><button class="btn s" style="background:rgba(255,255,255,.2)" onclick="closeAdm()">Đăng xuất</button><div class="adt">${T.map((t,i)=>`<button class="${atab==i?"on":""}" onclick="atab=${i};clr=false;ra()">${t}</button>`).join("")}</div><div class="fd">${b}</div>`;if(atab==2)pcs()}

function pcs(){const t=S.w.reduce((a,b)=>a+b,0);S.w.forEach((w,i)=>{const e=$("#pc"+i);if(e)e.textContent=w+" · "+(w/t*100).toFixed(1)+"%"})}

function addC(){const n=$("#an").value.trim(),k=$("#ak").value.trim(),e=$("#ae");

 if(!n)return e.textContent="Nhập tên khách hàng.";if(!/^\d{4}$/.test(k))return e.textContent="Mã phải gồm đúng 4 số.";

 if(S.c.some(x=>x.k==k))return e.textContent="Mã này đang được cấp cho khách khác.";

 S.c.unshift({n,k});save();ra()}

document.addEventListener("keydown",e=>{if(e.key=="Enter"){const g=$("#go");if(g&&!$("#adm").classList.contains("show"))g.click()}});

build();

</script></body></html>
